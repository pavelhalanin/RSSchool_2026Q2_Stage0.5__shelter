<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./../css/global.css">
    <link rel="stylesheet" href="./../css/colors.css">
    <link rel="stylesheet" href="./../css/assets.css">
    <link rel="stylesheet" href="./../css/1__header.css">
    <link rel="stylesheet" href="./../css/7__footer.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header" data-is-home="false">
        <div class="global__content">
            <a class="header__logo" href="./">
                <div class="header__logo_title">Cozy House</div>
                <div class="header__logo_subtitle">Shelter for pets in Boston</div>
            </a>
            <nav class="header__nav_menu">
                <ul>
                    <li>
                        <a class="assets__paragraph_I" href="../#about">About the shelter</a>
                    </li>
                    <li>
                        <a class="assets__paragraph_I" href="#" data-is-active="1">Our pets</a>
                    </li>
                    <li>
                        <a class="assets__paragraph_I" href="../#help">Help the shelter</a>
                    </li>
                    <li>
                        <a class="assets__paragraph_I" href="#contacts">Contacts</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <footer id="contacts" class="footer">
        <div class="global__content">
            <div class="footer__wraper_content">
                <div class="footer__contacts">
                    <div class="footer__contacts_h assets__h3">For questions and suggestions</div>
                    <a class="footer__contacts_element" href="mailto:email@shelter.com">
                        <img src="./../assets/footer/icon-email.svg" alt="">
                        <span class="assets__h4">email@shelter.com</span>
                    </a>
                    <a class="footer__contacts_element" href="tel:+136745677554">
                        <img src="./../assets/footer/icon-phone.svg" alt="">
                        <span class="assets__h4">+13 674 567 75 54</span>
                    </a>
                </div>
                <div class="footer__locations">
                    <div class="footer__locations_h assets__h3">We are waiting for your visit</div>
                    <a class="footer__locations_element" target="_blank"
                        href="https://maps.app.goo.gl/LR3DLL6KNnWQ1ZRd8">
                        <img src="./../assets/footer/icon-marker.svg" alt="">
                        <span class="assets__h4">1 Central Street, Boston (entrance from the store)</span>
                    </a>
                    <a class="footer__locations_element" target="_blank"
                        href="https://maps.app.goo.gl/MeHk4X1EKdm36FYg6">
                        <img src="./../assets/footer/icon-marker.svg" alt="">
                        <span class="assets__h4">18 South Park, London</span>
                    </a>
                </div>
                <div class="footer__puppy">
                    <img src="./../assets/footer/footer-puppy.png" alt="">
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
